<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planning des référents du 19Escalade</title>
<meta name="theme-color" content="#184848">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planning">

<link rel="icon" type="image/png" sizes="192x192" href="icone-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icone-180.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Mise en page : une colonne de jours ; chaque créneau est une carte avec une corde qui montre les heures assurées */
:root {
  --bg: #edf2f3;          /* gris-bleu du logo, très clair */
  --surface: #ffffff;
  --ink: #14302f;
  --muted: #546b6c;
  --line: #d2dfe1;
  --accent: #184848;      /* pétrole du logo */
  --accent-soft: #dce8ea;
  --ok: #23804f;
  --warn: #b26a00;
  --bad: #d42020;          /* rouge des croix du logo */
  --bad-soft: #f8e1dc;
  --warn-soft: #f7ead2;
  --ok-soft: #dcefe3;
  --rope1: #1f8a4c; --rope2: #9fd356; --rope3: #f2fbe6;  /* corde verte bicolore */
  --slack: #a0b8c0;
  --hero: #184848; --hero-ink: #ffffff; --hero-muted: #c6d8dc; --brand-light: #a0b8c0; --brand-red: #e01818;
  --dots: rgba(24,72,72,.11);
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1819; --surface: #162324; --ink: #e6efef; --muted: #98aeb0; --line: #2a3b3d;
    --accent: #a0c4cc; --accent-soft: #1d3638; --ok: #5cc98b; --warn: #e5a54a; --bad: #f07a66;
    --bad-soft: #3d221e; --warn-soft: #3a2f1c; --ok-soft: #1b3326; --slack: #4a565c; --hero: #123839; --dots: rgba(255,255,255,.06); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1819; --surface: #162324; --ink: #e6efef; --muted: #98aeb0; --line: #2a3b3d;
  --accent: #a0c4cc; --accent-soft: #1d3638; --ok: #5cc98b; --warn: #e5a54a; --bad: #f07a66;
  --bad-soft: #3d221e; --warn-soft: #3a2f1c; --ok-soft: #1b3326; --slack: #4a565c; --hero: #123839; --dots: rgba(255,255,255,.06); color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
  /* panneau de mur : grille de trous d'inserts */
  background-image: radial-gradient(circle, var(--dots) 1.6px, transparent 2.2px);
  background-size: 26px 26px;
}
.hero { position: relative; background: var(--hero); color: var(--hero-ink); border-radius: 16px; padding: 18px 18px 16px 112px; overflow: hidden; min-height: 120px; border-bottom: 4px solid var(--brand-red); }
/* Logo du club dans une pastille claire, pour que le contour pétrole ressorte sur le bandeau. */
.hero .logo { position: absolute; left: 14px; top: 16px; width: 84px; height: 84px; padding: 4px; border-radius: 50%; background: #f3f7f8; box-shadow: 0 0 0 3px var(--brand-light); }
.hero h1 .club { color: #ff6b5e; }
@media (max-width: 480px) { .hero { padding-left: 18px; padding-top: 86px; } .hero .logo { width: 62px; height: 62px; top: 14px; left: 16px; } }
.hero .lede { color: var(--hero-muted); }
.hold { position: absolute; border-radius: 46% 54% 40% 60% / 55% 45% 55% 45%; }
.hold::after { content: ""; position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px; border-radius: 50%; background: rgba(0,0,0,.45); }
.status { display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; line-height: 1.15; max-width: 9.5rem; }
.status small { font-size: .78rem; font-weight: 600; text-transform: none; letter-spacing: 0; font-variant-numeric: tabular-nums; white-space: nowrap; }
.status.ok { color: var(--ok); } .status.bad { color: var(--bad); }
.ropewrap { position: relative; height: 22px; }
.slack { position: absolute; left: 0; right: 0; top: 9px; height: 4px; background-image: radial-gradient(circle, var(--slack) 1.6px, transparent 2px); background-size: 8px 4px; }
.rope { position: absolute; top: 5px; height: 12px; border-radius: 6px;
  background: repeating-linear-gradient(-60deg, var(--rope1) 0 5px, var(--rope2) 5px 8px, var(--rope1) 8px 11px, var(--rope3) 11px 12.5px);
  box-shadow: inset 0 -2px 0 rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.25); }
.ico { flex: none; }
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
/* La liste des jours est elle-même une .wrap dans la .wrap : sans largeur imposée, ses marges auto la rétrécissaient à la taille de son contenu. */
#days { width: 100%; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: .01em; }
h1 { font-size: 2.1rem; line-height: 1.05; text-transform: uppercase; }
.lede { margin: 6px 0 0; color: var(--muted); max-width: 60ch; }
.top { display: flex; flex-direction: column; gap: 14px; }
.toplinks { display: flex; justify-content: flex-end; }
a.nav { --halo: var(--surface); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
a.nav:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.weekbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.weekbar .label { font-family: var(--display); font-size: 1.35rem; font-weight: 600; flex: 1; min-width: 0; }
/* Téléphone : le titre de la semaine sur sa propre ligne, les boutons dessous. */
.weekbar .label { flex: 1 1 100%; order: -1; }
button { font: inherit; cursor: pointer; }
.nav { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 6px 12px; font-weight: 600; }
.nav:hover { border-color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.want { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.climb { --d: var(--surface); --tape: var(--surface); display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; border: 2px solid var(--accent); background: var(--surface); color: var(--accent); border-radius: 999px; padding: 6px 16px; font-weight: 700; font-family: var(--display); font-size: 1.05rem; letter-spacing: .02em; }
.climb[aria-pressed="true"] { --d: var(--accent); --tape: var(--accent); background: var(--accent); color: var(--surface); }
.count { display: inline-flex; align-items: center; gap: 4px; --d: var(--surface); --tape: var(--surface); font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.count strong { color: var(--accent); font-size: 1.05rem; }
button.count { border: 0; background: transparent; border-radius: 8px; padding: 3px 6px; margin-left: -6px; }
button.count:hover { background: var(--accent-soft); color: var(--ink); }
button.count .chev { font-size: .75rem; color: var(--accent); }
form.signup.climbform { grid-template-columns: 1fr; }
.nudge { display: flex; align-items: center; gap: 8px; margin: 0; background: var(--ok-soft); color: var(--ok); border-radius: 10px; padding: 8px 6px 8px 12px; font-weight: 600; font-size: .92rem; }
.nudge span { flex: 1; min-width: 0; }
.nudge .x { border: 0; background: transparent; color: inherit; width: 26px; height: 26px; border-radius: 50%; font-size: 1rem; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-weight: 600; font-size: .82rem; font-variant-numeric: tabular-nums; }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.info { background: var(--accent-soft); color: var(--accent); }
.notice { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; color: var(--muted); font-size: .92rem; }
.notice strong { color: var(--ink); }
.day { display: flex; flex-direction: column; gap: 8px; }
.day h2 { font-size: 1.15rem; text-transform: uppercase; color: var(--muted); letter-spacing: .06em; display: flex; gap: 8px; align-items: center; }
.day h2::after { content: ""; flex: 1; border-top: 2px dashed var(--line); }
.day h2 .today { color: var(--accent); font-size: .8rem; letter-spacing: .08em; }
.slot { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.slot.past { opacity: .62; }
.slot-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.slot-time { font-family: var(--display); font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.slot-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.slot-head { flex-wrap: nowrap; align-items: flex-start; }
.slot-place { color: var(--muted); font-size: .9rem; }
.ticks { display: flex; justify-content: space-between; font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: -8px; }
.people { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; margin: 0; padding: 0; }
.person { --halo: var(--surface); display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 4px 3px 8px; font-size: .92rem; }
.person .who { display: inline-flex; align-items: center; gap: 6px; }
.person .h { color: var(--muted); font-variant-numeric: tabular-nums; font-size: .85rem; }
.person .x { border: 0; background: transparent; color: var(--muted); width: 26px; height: 26px; border-radius: 50%; line-height: 1; font-size: 1rem; }
.person .x:hover { background: var(--bad-soft); color: var(--bad); }
.person.confirm { border-color: var(--bad); }
.person .yes { border: 0; background: var(--bad); color: var(--surface); border-radius: 999px; padding: 2px 10px; font-size: .8rem; font-weight: 600; }
.empty { color: var(--muted); font-size: .9rem; margin: 0; }
.add { align-self: flex-start; border: 1px dashed var(--accent); color: var(--accent); background: transparent; border-radius: 999px; padding: 5px 14px; font-weight: 600; font-size: .9rem; }
.add:hover { background: var(--accent-soft); }
form.signup { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: end; background: var(--bg); padding: 10px; border-radius: 10px; }
form.signup label { display: flex; flex-direction: column; gap: 3px; font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; min-width: 0; }
form.signup input { font: inherit; font-size: 1rem; text-transform: none; letter-spacing: 0; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; width: 100%; min-width: 0; }
form.signup .actions { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.primary { background: var(--accent); color: var(--surface); border: 0; border-radius: 8px; padding: 8px 16px; font-weight: 600; }
.ghost { background: transparent; border: 0; color: var(--muted); padding: 8px 10px; }
.err { color: var(--bad); font-size: .88rem; }
.hint { color: var(--muted); font-size: .82rem; }
@media (max-width: 480px) {
  form.signup { grid-template-columns: 1fr 1fr; }
  form.signup label.name { grid-column: 1 / -1; }
  h1 { font-size: 1.75rem; }
}
.empty-day { display: none; }
/* Ordinateur : la semaine en 7 colonnes, comme l'ancien tableur. */
@media (min-width: 1100px) {
  .wrap { max-width: 1440px; }
  .top { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 14px 24px; }
  .top > .toplinks { grid-column: 1 / -1; }
  .top > #status { grid-column: 1 / -1; }
  .weekbar { flex-wrap: nowrap; }
  .weekbar .label { white-space: nowrap; flex: 1; order: 0; }
  #days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 12px; align-items: start; }
  #days > .notice { grid-column: 1 / -1; }
  .empty-day { display: flex; }
  .day h2 { font-size: 1rem; flex-wrap: wrap; row-gap: 0; }
  .day h2::after { display: none; }
  .day h2 .today { flex-basis: 100%; }
  .day .empty { padding: 14px 4px; }
  .slot { padding: 12px; gap: 8px; }
  .slot-head { flex-direction: column; align-items: flex-start; gap: 6px; }
  .slot-time { font-size: 1.3rem; }
  .slot-meta { min-width: 0; }
  .status { flex-direction: row; align-items: center; text-align: left; flex-wrap: wrap; max-width: none; gap: 2px 6px; }
  .status svg { width: 18px; height: 28px; }
  .status small { flex-basis: 100%; padding-left: 24px; }
  .people { flex-direction: column; align-items: stretch; }
  .person { justify-content: flex-start; font-size: .88rem; }
  /* Référent : prénom sur la première ligne, horaires dessous, croix à droite. */
  .person { border-radius: 12px; padding: 4px 4px 4px 8px; }
  .person .who { flex: 1 1 auto; min-width: 0; flex-direction: column; align-items: flex-start; gap: 0; }
  .person .n { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .person .x, .person .yes { flex: none; }
  .person .h { font-size: .78rem; }
  .climb { font-size: .95rem; padding: 5px 12px 5px 8px; white-space: nowrap; }
  .count { font-size: .82rem; }
  .add { font-size: .85rem; }
  form.signup { grid-template-columns: 1fr 1fr; }
  form.signup label.name { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: no-preference) { .slot { transition: opacity .2s; } }
</style>
</head>

      <p class="lede" id="lede">Inscris-toi sur un créneau et indique tes horaires si tu ne restes pas jusqu'au bout. La corde montre les heures assurées, le pointillé ce qui reste à prendre.</p>

<script>
(function () {
  // Créneaux habituels au gymnase Ladoumègue (hors vacances scolaires). 0 = lundi.
  // Vue par défaut : adhérents (lecture seule). ?vue=referents ouvre la vue référents ; ?vue=adherents reste accepté.
  const ADH = new URLSearchParams(location.search).get("vue") !== "referents";
  document.querySelectorAll(".toplinks[data-vue]").forEach(n => { if (n.dataset.vue !== (ADH ? "adherents" : "referents")) n.remove(); });

  // Données : Google Sheet via l'application Apps Script (lecture en GET, écritures en POST text/plain, sans pré-vérification CORS).
  const API_URL = "https://script.google.com/macros/s/AKfycbxre3-1nWjLnsJAnH007a_h36mdSMiO9Z8K47W3ZWQmczjHYyc660uNY8joWYIojXHX/exec";
  // Même enchaînement que les appels Apps Script d’origine : serveur().withSuccessHandler(f).withFailureHandler(g).action(...)
  function serveur() {
    let succes = () => {}, echec = () => {};
    const appel = (action, data) => {
      const req = action === "lire"
        ? fetch(API_URL + "?api=lire", { redirect: "follow", cache: "no-store" })
        : fetch(API_URL, { method: "POST", redirect: "follow", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action, data }) });
      req.then(rep => { if (!rep.ok) throw new Error("HTTP " + rep.status); return rep.json(); }, () => null)
        .then(rep => {
          if (rep === null) return echec({});  // réseau : message par défaut de la page
          if (rep && rep.ok === false) return echec({ message: rep.erreur });
          succes(action === "lire" ? rep : rep.data);
        })
        .catch(() => echec({}));
    };
    const api = {
      withSuccessHandler(f) { succes = f; return api; },
      withFailureHandler(f) { echec = f; return api; },
      getInscriptions: () => appel("lire"),
      ajouter: insc => appel("ajouter", insc),
      retirer: id => appel("retirer", id),
      grimper: (date, slot, nom) => appel("grimper", { date, slot, nom }),
      retirerEnvie: id => appel("retirerGrimpeur", id)
    };
    return api;
  }
  if (ADH) document.getElementById("lede").textContent = "Pas de référent, pas de grimpe. Viens quand le créneau est assuré.";
  const PLACE = "Ladoumègue";
  const TEMPLATE = {
    1: [{ id: "midi", start: "12:00", end: "13:30" }, { id: "soir", start: "19:00", end: "22:30" }],
    2: [{ id: "midi", start: "12:00", end: "14:00" }],
    3: [{ id: "soir", start: "17:30", end: "20:00" }],
    4: [{ id: "midi", start: "12:00", end: "13:30" }, { id: "soir", start: "18:00", end: "22:30" }],
    5: [{ id: "aprem", start: "13:00", end: "20:00" }],
    6: [{ id: "jour", start: "08:00", end: "18:00" }]
  };
  // Fermeture exceptionnelle (travaux) : Ladoumègue fermé, sorties autonomes dans des salles privées.
  const CLOSURES = [{ from: "2026-10-19", to: "2026-11-01", label: "Vacances de la Toussaint : Ladoumègue est fermé." }];
  // Vacances scolaires : créneaux habituels, sauf samedi jusqu'à 17h et pas de dimanche.
  const HOLIDAYS = [
    { from: "2026-12-19", to: "2027-01-03", label: "Vacances de Noël" },
    { from: "2027-02-06", to: "2027-02-21", label: "Vacances d'hiver" },
    { from: "2027-04-03", to: "2027-04-18", label: "Vacances de printemps" }
  ];
  const OUTINGS = {
    "2026-10-20": [{ id: "auto", start: "19:00", end: "22:30", place: "Arkose Pantin", from: true }],
    "2026-10-24": [{ id: "auto", start: "14:00", end: "18:00", place: "Climb'Up Aubervilliers" }],
    "2026-10-27": [{ id: "auto", start: "19:00", end: "22:30", place: "Climb'Up Aubervilliers", from: true }],
    "2026-10-31": [{ id: "auto", start: "14:00", end: "18:00", place: "Arkose Pantin" }]
  };
  const DAYS = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi", "Dimanche"];
  const MONTHS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];

  const pad = n => String(n).padStart(2, "0");
  const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const parseIso = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  const mondayOf = d => addDays(new Date(d.getFullYear(), d.getMonth(), d.getDate()), -((d.getDay() + 6) % 7));
  const toMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
  const fmt = t => { const [h, m] = t.split(":"); return Number(h) + "h" + (m === "00" ? "" : m); };
  const fmtMin = x => fmt(pad(Math.floor(x / 60)) + ":" + pad(x % 60));

  function closureFor(dateIso) {
    return CLOSURES.find(c => dateIso >= c.from && dateIso <= c.to);
  }
  function holidayFor(dateIso) {
    return HOLIDAYS.find(c => dateIso >= c.from && dateIso <= c.to);
  }
  function slotsFor(date) {
    const key = iso(date), wd = (date.getDay() + 6) % 7;
    if (closureFor(key)) return (OUTINGS[key] || []).map(s => ({ ...s, auto: true }));
    if (holidayFor(key) && wd === 6) return [];
    return (TEMPLATE[wd] || []).map(s => ({ ...s, place: PLACE, ...(holidayFor(key) && wd === 5 ? { end: "17:00" } : {}) }));
  }

  // Couverture : fusionne les intervalles des inscrits et renvoie segments couverts + trous.
  function coverage(slot, entries) {
    const s = toMin(slot.start), e = toMin(slot.end);
    const iv = entries.map(x => [Math.max(s, toMin(x.debut)), Math.min(e, toMin(x.fin))])
      .filter(([a, b]) => b > a).sort((a, b) => a[0] - b[0]);
    const merged = [];
    for (const [a, b] of iv) {
      const last = merged[merged.length - 1];
      if (last && a <= last[1]) last[1] = Math.max(last[1], b); else merged.push([a, b]);
    }
    const gaps = []; let cur = s;
    for (const [a, b] of merged) { if (a > cur) gaps.push([cur, a]); cur = Math.max(cur, b); }
    if (cur < e) gaps.push([cur, e]);
    return { s, e, merged, gaps };
  }

  let week = mondayOf(new Date());
  let entries = [];          // toutes les inscriptions {id, date, slot, nom, debut, fin}
  let db = null, canWrite = !ADH, loaded = false, nudgeKey = null;
  let openForm = null;       // clé "date|slot" du formulaire ouvert
  let confirmId = null;      // inscription en attente de confirmation de retrait
  let formError = "";

  const $ = id => document.getElementById(id);
  const icon = (id, w, h, cls) => { const NS = "http://www.w3.org/2000/svg"; const svg = document.createElementNS(NS, "svg"); svg.setAttribute("width", w); svg.setAttribute("height", h); svg.setAttribute("class", "ico" + (cls ? " " + cls : "")); svg.setAttribute("aria-hidden", "true"); const u = document.createElementNS(NS, "use"); u.setAttribute("href", "#" + id); svg.appendChild(u); return svg; };
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  let savedName = "";
  try { savedName = localStorage.getItem("referent-nom") || ""; } catch (e) {}

  function render() {
    const sunday = addDays(week, 6);
    $("weeklabel").textContent = "Semaine du " + week.getDate() + (week.getMonth() !== sunday.getMonth() ? " " + MONTHS[week.getMonth()] : "") +
      " au " + sunday.getDate() + " " + MONTHS[sunday.getMonth()];
    const todayIso = iso(new Date());
    const closure = closureFor(iso(week)) || closureFor(iso(sunday));
    const main = $("days"); main.textContent = "";
    if (closure) main.appendChild(el("div", "notice", closure.label + (ADH ? " Les sorties ci-dessous sont des créneaux autonomes." : " Les sorties ci-dessous sont des créneaux autonomes : inscris-toi si tu viens.")));
    const holiday = !closure && (holidayFor(iso(week)) || holidayFor(iso(sunday)));
    if (holiday) main.appendChild(el("div", "notice", holiday.label + " : horaires habituels, sauf le samedi qui s'arrête à 17h et pas de créneau le dimanche."));

    for (let i = 0; i < 7; i++) {
      const date = addDays(week, i), dIso = iso(date), slots = slotsFor(date);
      // Un jour sans créneau reste dans la grille ordinateur (colonne vide), mais est masqué sur téléphone.
      const day = el("section", "day" + (slots.length ? "" : " empty-day"));
      const h = el("h2", null, DAYS[i] + " " + date.getDate() + " " + MONTHS[date.getMonth()]);
      if (dIso === todayIso) h.appendChild(el("span", "today", "Aujourd'hui"));
      day.appendChild(h);
      if (!slots.length) day.appendChild(el("p", "empty", "Pas de créneau"));
      for (const slot of slots) {
        const mine = entries.filter(x => x.date === dIso && x.slot === slot.id);
        const cov = coverage(slot, mine);
        const past = dIso < todayIso;
        day.appendChild(renderSlot(dIso, slot, mine, cov, past));
      }
      main.appendChild(day);
    }

  }

  function renderSlot(dIso, slot, mine, cov, past) {
    const key = dIso + "|" + slot.id;
    const card = el("article", "slot" + (past ? " past" : ""));
    const head = el("div", "slot-head");
    const meta = el("div", "slot-meta");
    meta.appendChild(el("div", "slot-time", fmt(slot.start) + (slot.from ? "" : " – " + fmt(slot.end))));
    meta.appendChild(el("div", "slot-place", slot.auto ? "Sortie autonome · " + slot.place + (slot.from ? " · dès " + fmt(slot.start) : "") : slot.place));
    head.appendChild(meta);
    let st;
    if (slot.auto) st = el("span", "pill info", mine.length ? mine.length + " inscrit" + (mine.length > 1 ? "s" : "") : "Sortie libre");
    else if (!cov.merged.length) {
      // Mousqueton poire ouvert, rouge : aucun référent.
      st = el("div", "status bad"); st.appendChild(icon("mq-ouvert", 26, 40)); st.appendChild(el("span", null, "Non assuré"));
    } else {
      // Mousqueton poire verrouillé, vert : au moins un référent, même sur une partie du créneau.
      st = el("div", "status ok"); st.appendChild(icon("mq-ferme", 26, 40)); st.appendChild(el("span", null, "Assuré"));
      // Plages couvertes, au format 19:00–22:15, une par ligne.
      const hhmm = x => pad(Math.floor(x / 60)) + ":" + pad(x % 60);
      cov.merged.forEach(([a, b]) => st.appendChild(el("small", null, hhmm(a) + "–" + hhmm(b))));
    }
    head.appendChild(st);
    card.appendChild(head);

    if (!slot.auto) {
      // Corde : tronçons tendus pour les heures assurées, pointillé (le mou) pour le reste.
      const bar = el("div", "ropewrap"); const span = cov.e - cov.s;
      bar.setAttribute("role", "img");
      bar.setAttribute("aria-label", !cov.merged.length ? "Aucune heure assurée" : cov.gaps.length ? "Reste à assurer : " + cov.gaps.map(([a, b]) => fmtMin(a) + " à " + fmtMin(b)).join(", ") : "Créneau entièrement assuré");
      bar.appendChild(el("div", "slack"));
      for (const [a, b] of cov.merged) {
        const s = el("div", "rope"); s.style.left = ((a - cov.s) / span * 100) + "%"; s.style.width = ((b - a) / span * 100) + "%"; bar.appendChild(s);
      }
      card.appendChild(bar);
      const ticks = el("div", "ticks"); ticks.appendChild(el("span", null, fmt(slot.start))); ticks.appendChild(el("span", null, fmt(slot.end)));
      card.appendChild(ticks);
    }

    if (mine.length) {
      const ul = el("ul", "people");
      mine.slice().sort((a, b) => a.debut.localeCompare(b.debut)).forEach(x => {
        const li = el("li", "person" + (confirmId === x.id ? " confirm" : ""));
        li.appendChild(icon("huit", 15, 28));
        const who = el("span", "who");
        who.appendChild(el("span", "n", x.nom));
        if (x.debut !== slot.start || x.fin !== slot.end) who.appendChild(el("span", "h", fmt(x.debut) + "–" + fmt(x.fin)));
        li.appendChild(who);
        if (db && canWrite) {
          if (confirmId === x.id) {
            const yes = el("button", "yes", "Retirer"); yes.type = "button"; yes.onclick = () => remove(x.id); li.appendChild(yes);
            const no = el("button", "x", "×"); no.type = "button"; no.setAttribute("aria-label", "Annuler"); no.onclick = () => { confirmId = null; render(); }; li.appendChild(no);
          } else {
            const xb = el("button", "x", "×"); xb.type = "button"; xb.setAttribute("aria-label", "Retirer " + x.nom); xb.onclick = () => { confirmId = x.id; render(); }; li.appendChild(xb);
          }
        }
        ul.appendChild(li);
      });
      card.appendChild(ul);
    } else if (!slot.auto) {
      card.appendChild(el("p", "empty", past ? "Personne n'était inscrit." : "Aucun référent pour l'instant."));
    }

    if (!slot.auto) {
      const list = envies.filter(x => x.date === dIso && x.slot === slot.id);
      const n = list.length, open = n > 0 && openLists.has(key);
      const moi = grimpeurNom ? list.find(x => cleNom(x.nom) === cleNom(grimpeurNom)) : null;
      const want = el("div", "want");
      if (ADH && db && !past && openClimb !== key) {
        const btn = el("button", "climb"); btn.type = "button";
        btn.appendChild(icon("main", 20, 25)); btn.appendChild(document.createTextNode(moi ? "Je veux grimper ✓" : "Je veux grimper !"));
        btn.setAttribute("aria-pressed", moi ? "true" : "false");
        btn.title = moi ? "Cliquer pour retirer " + moi.nom + " de la liste" : "Donne ton prénom pour que les référents sachent que tu viens";
        btn.onclick = moi ? () => removeEnvie(moi.id) : () => { openClimb = key; climbError = ""; confirmId = null; render(); const g = $("g-nom"); if (g) g.focus(); };
        want.appendChild(btn);
      }
      if (n || (ADH && !past)) {
        const c = el(n ? "button" : "span", "count");
        if (n) { c.type = "button"; c.setAttribute("aria-expanded", open ? "true" : "false"); c.title = open ? "Masquer la liste" : "Voir qui vient";
          c.onclick = () => { if (open) openLists.delete(key); else openLists.add(key); render(); }; }
        c.appendChild(icon("main", 16, 20)); c.lastChild.style.color = "var(--accent)";
        c.appendChild(el("strong", null, String(n)));
        c.appendChild(document.createTextNode(n > 1 ? " grimpeurs veulent venir" : " grimpeur veut venir"));
        if (n) c.appendChild(el("span", "chev", open ? " ▲" : " ▼"));
        want.appendChild(c);
      }
      if (want.childNodes.length) card.appendChild(want);
      if (open) {
        const ul = el("ul", "people climbers");
        list.forEach(x => {
          const li = el("li", "person" + (confirmId === x.id ? " confirm" : ""));
          li.appendChild(icon("main", 14, 18));
          const who = el("span", "who"); who.appendChild(el("span", "n", x.nom)); li.appendChild(who);
          if (db && !past) {
            if (confirmId === x.id) {
              const yes = el("button", "yes", "Retirer"); yes.type = "button"; yes.onclick = () => removeEnvie(x.id); li.appendChild(yes);
              const no = el("button", "x", "×"); no.type = "button"; no.setAttribute("aria-label", "Annuler"); no.onclick = () => { confirmId = null; render(); }; li.appendChild(no);
            } else {
              const xb = el("button", "x", "×"); xb.type = "button"; xb.setAttribute("aria-label", "Retirer " + x.nom); xb.onclick = () => { confirmId = x.id; render(); }; li.appendChild(xb);
            }
          }
          ul.appendChild(li);
        });
        card.appendChild(ul);
      }
      if (openClimb === key) card.appendChild(renderClimbForm(dIso, slot));
    }

    if (nudgeKey === key) {
      const nudge = el("p", "nudge"); nudge.setAttribute("role", "status");
      nudge.appendChild(el("span", null, "N'hésite pas à prévenir les autres sur WhatsApp !"));
      const close = el("button", "x", "×"); close.type = "button"; close.setAttribute("aria-label", "Fermer"); close.onclick = () => { nudgeKey = null; render(); };
      nudge.appendChild(close); card.appendChild(nudge);
    }

    if (db && canWrite && !past) {
      if (openForm === key) card.appendChild(renderForm(dIso, slot));
      else {
        const add = el("button", "add", slot.auto ? "+ Je viens" : "+ Je m'inscris"); add.type = "button";
        add.onclick = () => { openForm = key; formError = ""; confirmId = null; render(); const n = $("f-nom"); if (n) n.focus(); };
        card.appendChild(add);
      }
    }
    return card;
  }

  function renderForm(dIso, slot) {
    const f = el("form", "signup");
    const ln = el("label", "name", "Prénom"); const inN = el("input"); inN.id = "f-nom"; inN.required = true; inN.maxLength = 40; inN.autocomplete = "given-name"; inN.value = savedName; ln.appendChild(inN);
    const ld = el("label", null, "Arrivée"); const inD = el("input"); inD.id = "f-debut"; inD.type = "time"; inD.step = 900; inD.value = slot.start; inD.min = slot.start; inD.max = slot.end; ld.appendChild(inD);
    const lf = el("label", null, "Départ"); const inF = el("input"); inF.id = "f-fin"; inF.type = "time"; inF.step = 900; inF.value = slot.end; inF.min = slot.start; inF.max = slot.end; lf.appendChild(inF);
    f.append(ln, ld, lf);
    const act = el("div", "actions");
    const ok = el("button", "primary", "Inscrire"); ok.type = "submit";
    const cancel = el("button", "ghost", "Annuler"); cancel.type = "button"; cancel.onclick = () => { openForm = null; openClimb = null; nudgeKey = null; render(); };
    act.append(ok, cancel);
    if (formError) act.appendChild(el("span", "err", formError));
    else act.appendChild(el("span", "hint", "Laisse les horaires tels quels si tu fais tout le créneau."));
    f.appendChild(act);
    f.addEventListener("submit", async ev => {
      ev.preventDefault();
      const nom = inN.value.trim(), debut = inD.value, fin = inF.value;
      if (!nom) { formError = "Indique ton prénom."; render(); return; }
      if (!debut || !fin || toMin(fin) <= toMin(debut)) { formError = "L'heure de départ doit être après l'heure d'arrivée."; render(); return; }
      if (toMin(debut) < toMin(slot.start) || toMin(fin) > toMin(slot.end)) { formError = "Choisis des horaires entre " + fmt(slot.start) + " et " + fmt(slot.end) + "."; render(); return; }
      ok.disabled = true;
      serveur()
        .withSuccessHandler(list => {
          savedName = nom; try { localStorage.setItem("referent-nom", nom); } catch (e) {}
          openForm = null; formError = "";
          // Midi en semaine et jeudi : petit rappel pour prévenir le groupe.
          nudgeKey = (slot.id === "midi" || parseIso(dIso).getDay() === 4) && !slot.auto ? dIso + "|" + slot.id : null;
          setEntries(list);
        })
        .withFailureHandler(err => {
          ok.disabled = false;
          formError = (err && err.message) || "L'inscription n'a pas été enregistrée. Réessaie dans un instant.";
          render();
        })
        .ajouter({ date: dIso, slot: slot.id, nom, debut, fin });
    });
    return f;
  }

  function renderClimbForm(dIso, slot) {
    const f = el("form", "signup climbform");
    const ln = el("label", "name", "Ton prénom"); const inN = el("input"); inN.id = "g-nom"; inN.required = true; inN.maxLength = 40; inN.autocomplete = "given-name"; inN.value = grimpeurNom; ln.appendChild(inN);
    f.appendChild(ln);
    const act = el("div", "actions");
    const ok = el("button", "primary", "Je viens"); ok.type = "submit";
    const cancel = el("button", "ghost", "Annuler"); cancel.type = "button"; cancel.onclick = () => { openClimb = null; climbError = ""; render(); };
    act.append(ok, cancel);
    act.appendChild(climbError ? el("span", "err", climbError) : el("span", "hint", "Ajoute l'initiale de ton nom si ton prénom est courant (ex. Thomas B.)."));
    f.appendChild(act);
    f.addEventListener("submit", ev => {
      ev.preventDefault();
      const nom = inN.value.trim();
      if (!nom) { climbError = "Indique ton prénom."; render(); return; }
      ok.disabled = true;
      grimper(dIso, slot.id, nom, err => { climbError = (err && err.message) || "Ton prénom n'a pas été enregistré. Réessaie dans un instant."; render(); });
    });
    return f;
  }

  function remove(id) {
    confirmId = null;
    serveur()
      .withSuccessHandler(setEntries)
      .withFailureHandler(() => { showStatus("Le retrait n'a pas été enregistré. Réessaie dans un instant."); render(); })
      .retirer(id);
    render();
  }

  // « Je veux grimper ! » : chaque grimpeur donne son prénom, la liste se déroule sous le compteur.
  let envies = [], openClimb = null, climbError = "";
  const openLists = new Set();
  let grimpeurNom = savedName;
  try { grimpeurNom = localStorage.getItem("grimpeur-nom") || savedName; } catch (e) {}
  const cleNom = n => String(n).normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, " ").trim().toLowerCase();

  function grimper(dIso, slotId, nom, onError) {
    const key = dIso + "|" + slotId;
    serveur()
      .withSuccessHandler(list => {
        grimpeurNom = nom; try { localStorage.setItem("grimpeur-nom", nom); } catch (e) {}
        openClimb = null; climbError = ""; openLists.add(key); setEntries(list);
      })
      .withFailureHandler(onError)
      .grimper(dIso, slotId, nom);
  }

  function removeEnvie(id) {
    confirmId = null;
    serveur()
      .withSuccessHandler(setEntries)
      .withFailureHandler(() => { showStatus("Le retrait n'a pas été enregistré. Réessaie dans un instant."); render(); })
      .retirerEnvie(id);
    render();
  }

  function setEntries(data) {
    envies = ((data && data.envies) || []).filter(x => x && typeof x.date === "string" && typeof x.slot === "string" && typeof x.nom === "string");
    entries = ((data && data.inscriptions) || []).filter(x => x && typeof x.date === "string" && typeof x.slot === "string" && typeof x.nom === "string" &&
      /^\d\d:\d\d$/.test(x.debut) && /^\d\d:\d\d$/.test(x.fin));
    db = true; loaded = true; $("status").hidden = true; render();
  }

  // Recharge les inscriptions des autres toutes les minutes, sauf pendant une saisie.
  function refresh() {
    serveur()
      .withSuccessHandler(list => { if (!openForm && !openClimb && !confirmId) setEntries(list); })
      .withFailureHandler(() => { loaded = true; showStatus("Impossible de charger les inscriptions. Recharge la page."); render(); })
      .getInscriptions();
  }

  function showStatus(msg) { const s = $("status"); s.textContent = msg; s.hidden = false; }

  $("prev").onclick = () => { week = addDays(week, -7); openForm = null; openClimb = null; nudgeKey = null; render(); };
  $("next").onclick = () => { week = addDays(week, 7); openForm = null; openClimb = null; nudgeKey = null; render(); };
  $("today").onclick = () => { week = mondayOf(new Date()); openForm = null; openClimb = null; nudgeKey = null; render(); };
  // Téléphone : balayer la page vers la gauche ou la droite change de semaine.
  let doigt = null;
  document.addEventListener("touchstart", e => {
    const t = e.touches[0];
    // Les bords de l'écran servent au geste « retour » du téléphone ; les champs de saisie gardent leurs gestes.
    if (e.touches.length !== 1 || t.clientX < 30 || t.clientX > window.innerWidth - 30 || e.target.closest("input, textarea, form")) { doigt = null; return; }
    doigt = { x: t.clientX, y: t.clientY, t: Date.now() };
  }, { passive: true });
  document.addEventListener("touchend", e => {
    if (!doigt) return;
    const t = e.changedTouches[0], dx = t.clientX - doigt.x, dy = t.clientY - doigt.y, duree = Date.now() - doigt.t;
    doigt = null;
    if (duree > 1000 || Math.abs(dx) < 50 || Math.abs(dx) < 1.5 * Math.abs(dy)) return;
    $(dx < 0 ? "next" : "prev").click();
  }, { passive: true });
  document.addEventListener("touchcancel", () => { doigt = null; }, { passive: true });
  // Flèches gauche/droite du clavier : semaine précédente/suivante (sauf pendant une saisie).
  document.addEventListener("keydown", e => {
    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    const t = e.target;
    if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
    if (e.key === "ArrowLeft") $("prev").click();
    else if (e.key === "ArrowRight") $("next").click();
    else return;
    e.preventDefault();
  });

  render();

  refresh();
  setInterval(() => { if (!document.hidden) refresh(); }, 60000);
  // Au retour sur la page après un moment (appli de l'écran d'accueil restée ouverte), on revient à la semaine en cours.
  let cacheLe = 0;
  const retour = () => {
    if (cacheLe && Date.now() - cacheLe > 10 * 60000) { week = mondayOf(new Date()); openForm = null; openClimb = null; confirmId = null; nudgeKey = null; render(); }
    cacheLe = 0; refresh();
  };
  document.addEventListener("visibilitychange", () => { if (document.hidden) cacheLe = Date.now(); else retour(); });
  window.addEventListener("pageshow", e => { if (e.persisted) { if (!cacheLe) cacheLe = 1; retour(); } });
})();
</script>
</body>
</html>
